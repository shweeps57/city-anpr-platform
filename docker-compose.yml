services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: anpr-postgres
    environment:
      POSTGRES_DB: anpr
      POSTGRES_USER: anpr
      POSTGRES_PASSWORD: anpr_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    container_name: anpr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
    container_name: anpr-backend
    ports:
      - "8000:8000"
    volumes:
      - ./config:/config:ro
      - ./frontend:/app/frontend:ro
    depends_on:
      - postgres
      - redis

  perception:
    build:
      context: ./perception
    container_name: anpr-perception
    volumes:
      - ./models:/app/models:ro
      - ./data/videos:/app/data/videos:ro
      - ./data/snapshots:/app/data/snapshots
      - ./config:/app/config:ro
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_STREAM: plate-events
      VEHICLE_MODEL: /app/models/yolov8n.pt
      PLATE_MODEL: /app/models/plate_detector.pt
      CAMERA_CONFIG: /app/config/cameras.json
      PROCESSING_MODE: sequential
    depends_on:
      - redis
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
